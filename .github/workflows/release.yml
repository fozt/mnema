# A pushed tag vX.Y.Z publishes the release: the source archive (Linux app updates), the
# self-contained Mac app (zip for updates, DMG for installs), the signed APK, the manifests the
# apps read from releases/latest/download/ and the server image ghcr.io/<repo>:X.Y.Z for
# linux/amd64 and linux/arm64. Everything is built first, uploaded to a draft, checked; the image
# is tagged latest and only then the release is published as the latest.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # the same checks as every push: a red commit is never published
  checks:
    uses: ./.github/workflows/ci.yml

  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Tag matches the version
        run: |
          version=$(uv run --no-project --python 3.12 python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match pyproject.toml version $version"
            exit 1
          fi
      - name: Source archive
        run: uv run --no-project --python 3.12 python -m scripts.build_release "$TAG" --dist dist
      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: dist/mnema-*.tar.gz
          if-no-files-found: error

  ffmpeg:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # a tag sees only the caches of its own ref and of main: CI saves this one on main, the
      # release never saves (each tag would add another copy)
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ffmpeg-prefix
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_ffmpeg.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/build_ffmpeg.sh "$RUNNER_TEMP/ffmpeg-prefix"
      # a tar keeps the executable bits that an artifact loses
      - run: tar -cf ffmpeg.tar -C "$RUNNER_TEMP/ffmpeg-prefix" bin src licenses
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg
          path: ffmpeg.tar
          if-no-files-found: error

  mac:
    needs: ffmpeg
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      # no uv cache: a tag cannot reuse it, and gigabytes per release would push CI caches out
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg
          path: ${{ runner.temp }}
      # outside the checkout: the build copies the project files it does not ignore
      - run: mkdir "$RUNNER_TEMP/ffmpeg-prefix" && tar -xf "$RUNNER_TEMP/ffmpeg.tar" -C "$RUNNER_TEMP/ffmpeg-prefix"
      - run: swift --version
      - run: uv python install 3.12
      - name: Mnema.app, zip and DMG
        run: |
          uv run --no-project --python 3.12 python -m scripts.build_mac_app \
            --out "$RUNNER_TEMP/mac" --ffmpeg "$RUNNER_TEMP/ffmpeg-prefix" \
            --sources --version "${TAG#v}" --smoke
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: |
            ${{ runner.temp }}/mac/Mnema-*-mac.zip
            ${{ runner.temp }}/mac/Mnema-*.dmg
            ${{ runner.temp }}/mac/third-party-sources-*.tar.gz
          if-no-files-found: error
          compression-level: 0

  # The server image, built natively for each platform and checked there: it starts as an
  # unprivileged user of its data folder, answers its healthcheck and makes an invitation. Pushed
  # as :X.Y.Z-<arch>, joined into :X.Y.Z by image; :latest moves in publish.
  image-build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # the build needs more disk than the runner leaves free
      - run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build
        run: |
          docker build -t "$IMAGE:${TAG#v}-${{ matrix.arch }}" \
            --label "org.opencontainers.image.version=${TAG#v}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
          docker image ls "$IMAGE"
      - name: Start check
        run: |
          mkdir data && sudo chown 4321:4321 data
          docker run -d --name mnema --user 4321:4321 -v "$PWD/data:/data" \
            -e MNEMA_URL=http://203.0.113.5:38837 "$IMAGE:${TAG#v}-${{ matrix.arch }}"
          for _ in $(seq 60); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' mnema)" = healthy ]; then
              docker logs mnema | grep -q '^http://203.0.113.5:38837#invite='
              docker exec mnema mnema invite | grep -q '^http://203.0.113.5:38837#invite='
              docker exec mnema mnema devices
              exit 0
            fi
            sleep 2
          done
          docker logs mnema
          exit 1
      - name: Push
        run: |
          printf '%s' "${{ github.token }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:${TAG#v}-${{ matrix.arch }}"

  image:
    needs: image-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - run: |
          printf '%s' "${{ github.token }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$IMAGE:${TAG#v}" \
            "$IMAGE:${TAG#v}-amd64" "$IMAGE:${TAG#v}-arm64"
          docker buildx imagetools inspect "$IMAGE:${TAG#v}"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Android SDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || missing="$missing ANDROID_$name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mnema.keystore"
      - name: Signed APK
        env:
          MNEMA_KEYSTORE: ${{ runner.temp }}/mnema.keystore
          MNEMA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MNEMA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MNEMA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: android/scripts/release-apk.sh "${TAG#v}"
      - if: always()
        run: rm -f "$RUNNER_TEMP/mnema.keystore"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/mnema-*.apk
          if-no-files-found: error

  publish:
    needs: [checks, source, mac, android, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Manifests
        run: |
          version=${TAG#v}
          uv run --no-project --python 3.12 python -m scripts.build_release "$TAG" --dist dist \
            --mac-zip "artifacts/mac/Mnema-$version-mac.zip" \
            --apk "artifacts/android/mnema-$version.apk"
          # the archive is reproducible: the one checked in the source job is the one described
          cmp dist/mnema-$version.tar.gz artifacts/source/mnema-$version.tar.gz
          cat dist/mnema-release.json dist/mnema-android.json
      - name: Draft release
        run: |
          if draft=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::Release $TAG is already published"
              exit 1
            fi
          else
            gh release create "$TAG" --draft --verify-tag --title "Mnema ${TAG#v}" --generate-notes
          fi
      - name: Upload assets
        run: |
          version=${TAG#v}
          set -- dist/mnema-$version.tar.gz dist/mnema-release.json dist/mnema-android.json \
            artifacts/mac/Mnema-$version-mac.zip artifacts/mac/Mnema-$version.dmg \
            artifacts/android/mnema-$version.apk artifacts/mac/third-party-sources-$version.tar.gz
          gh release upload "$TAG" --clobber "$@"
          for file in "$@"; do basename "$file"; done | sort > expected.txt
      - name: Check assets
        run: |
          gh release view "$TAG" --json assets -q '.assets[] | select(.state == "uploaded") | .name' \
            | sort > uploaded.txt
          diff -u expected.txt uploaded.txt
      # The installer pulls the image without signing in. GitHub creates a package private:
      # make it public once in its settings, then re-run this job.
      - name: Image is public
        run: |
          docker logout ghcr.io || true
          docker buildx imagetools inspect "$IMAGE:${TAG#v}" > /dev/null
      - name: Image latest
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:${TAG#v}"
      - name: Publish
        run: gh release edit "$TAG" --draft=false --latest
