# The Mnema server. ./install.sh server copies this file to ~/mnema-server and writes the
# values below to ~/mnema-server/.env; the data lives in ~/mnema-server/data. Its commands run
# from the folder of install.sh: ./mnema.sh users, invite, devices, update, logs.
name: ${MNEMA_NAME:-mnema}
services:
  mnema:
    image: ${MNEMA_IMAGE:-ghcr.io/fozt/mnema:latest}
    # always: every `up` (./mnema.sh update) brings the newest image; never: an image built here
    pull_policy: ${MNEMA_PULL:-always}
    container_name: ${MNEMA_NAME:-mnema}
    restart: unless-stopped
    # the owner of the data folder
    user: "${MNEMA_UID:-1000}:${MNEMA_GID:-1000}"
    ports:
      - "${MNEMA_PORT:-8000}:8000"
    environment:
      # this computer's address for invitations (an address given with --url wins over it)
      MNEMA_URL: ${MNEMA_URL:-}
      # the host's time zone: the time an invitation is valid until
      TZ: ${MNEMA_TZ:-UTC}
    volumes:
      - ./data:/data
