[project]
name = "mnema"
version = "0.4.1"
description = "Meeting recordings: transcription, translation, summaries, merging, compression"
requires-python = ">=3.12"
# The core is what the Mac app ships: recording, sync, the server connection and summaries
# without a server (litellm). The command (`mnema`, `mnema-mcp`) is the "cli" extra, the server's
# recognition and web stack are "full".
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",  # typed config from the environment (ops imports llm.config)
    "python-dotenv",
    "httpx",
    "litellm",  # the cloud model of the machine that processes
    # Chrome cookies on Linux: the decryption key is in the Secret Service (Keyring, KWallet).
    "secretstorage; sys_platform == 'linux'",
    # Microphone capture, light with wheels everywhere. In the core rather than an extra:
    # `uv run` syncs the environment exactly and would drop an extra on every run.
    "sounddevice>=0.5",
]

[project.optional-dependencies]
# Parakeet Ultra and the silero VAD on ONNX Runtime (CPU); the weights come from the HF hub.
# Engine.extra in mnema/core/backends.py names it.
parakeet = [
    "onnxruntime>=1.20",
    "numpy",
    "huggingface_hub",
]
# Terminal output of the command and the live view
term = ["rich"]
# The mnema command and mnema-mcp: `uv tool install "mnema[cli] @ <wheel of the release>"`, and
# the Linux client (./install.sh client). On a Mac it recognizes through the app's mnema-asr, on
# Linux with Parakeet on ONNX.
cli = [
    "mnema[term]",
    # Links (YouTube, Instagram, ...) to audio/video, downloaded where the command runs
    # (--cookies-from-browser reads local cookies). Extractors break when sites change: on a
    # regression raise the floor and relock. [default] is yt-dlp's recommended set.
    "yt-dlp[default]>=2026.10.21",
    # JS runtime for YouTube: the deno binary lands in the environment, no separate install.
    "deno>=2.9.8",
    "mcp>=1.2,<2",  # mnema-mcp; 2.0 renamed FastMCP (mcp.server.fastmcp)
    "websockets>=12",  # mnema live --runner
    "numpy",  # system audio PCM conversion (float32 48 kHz → int16 16 kHz)
    "pyobjc-framework-Cocoa; platform_system == 'Darwin'",  # system audio through a Core Audio tap
    "mnema[parakeet]; sys_platform == 'linux'",
]
# The server: recognition and the web API, live text included (/api/live).
full = [
    "mnema[parakeet,term]",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",  # multipart uploads to the server API
    "websockets>=12",
]
# The mnema-bar app. macOS: Mnema.app in Swift, PyObjC gives the engine the Trash and system
# audio, numpy converts the system audio; Linux: a pystray + AppIndicator tray (PyGObject;
# install.sh installs the system gir packages), Pillow draws its icons.
menubar = [
    "pyobjc-framework-Cocoa; platform_system == 'Darwin'",
    "numpy; platform_system == 'Darwin'",
    "pillow; platform_system == 'Linux'",
    "pystray; platform_system == 'Linux'",
    # <3.51 builds against girepository-1.0 (Ubuntu 22.04 and 24.04); newer needs 2.0
    "PyGObject<3.51; platform_system == 'Linux'",
]
# For one release: the update of 0.4 asks for these extras. Remove in 0.6.
mcp = ["mnema[cli]"]
whisper = []
gigaam = []
live = []

[dependency-groups]
# Development and test tools. CI installs the core and only these:
# `uv sync --no-dev --group tools`.
tools = [
    "ruff", "pytest", "pytest-xdist", "ty",  # xdist: `pytest -n auto` locally
    # the command's terminal output and link downloads
    "rich", "yt-dlp[default]>=2026.10.21",
    # the bundled silero_vad.onnx and Parakeet on ONNX are tested, not skipped
    "onnxruntime>=1.20", "numpy",
    # The server's HTTP stack for API tests (TestClient), so CI needs no engines
    "fastapi", "uvicorn[standard]", "python-multipart",
]
# Default group: plain `uv sync` installs the core and the tools, no recognition engines.
# Engines and the apps' extras on demand: `uv sync --all-extras`. install.sh and updates
# install with `--no-dev`, so the tools never reach an installation, and the app gets its own
# environment outside .venv: `uv sync` is exact, one .venv cannot serve both.
dev = [{ include-group = "tools" }]

[project.scripts]
mnema = "mnema.cli:main"
mnema-bar = "mnema.bar.app:main"
mnema-mcp = "mnema.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mnema"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W style, F errors, I imports, UP syntax upgrades, B bug traps
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# a third-party deprecation in the starlette TestClient
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient.:Warning"]
